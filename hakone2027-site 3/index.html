  <script data-runtime-athlete-pb-fix>
  (()=> {
    const norm=s=>String(s||'').normalize('NFKC').replace(/[\\s　]+/g,'').trim();
    const teamNorm=s=>String(s||'').normalize('NFKC')
      .replace('國學院大学','國學院大學').replace('國學院大','國學院大學')
      .replace('国学院大学','國學院大學').replace('国学院大','國學院大學').trim();
    const nameNorm=s=>{
      let v=String(s||'').trim();
      if(typeof window.normalizeForeignAthleteName==='function')v=window.normalizeForeignAthleteName(v);
      return norm(v);
    };
    function pbIndex(){
      const exact=new Map(),byName=new Map();
      const put=(team,name,pb)=>{
        const nk=nameNorm(name),tk=norm(teamNorm(team)); if(!nk)return;
        const key=nk+'|'+tk,prev=exact.get(key)||{};
        const merged={
          pb5000:(pb.pb5000&&pb.pb5000!=='—')?pb.pb5000:(prev.pb5000||'—'),
          pb10000:(pb.pb10000&&pb.pb10000!=='—')?pb.pb10000:(prev.pb10000||'—'),
          half:(pb.half&&pb.half!=='—')?pb.half:(prev.half||'—')
        };
        exact.set(key,merged);
      };
      if(typeof fullRosterData!=='undefined'){
        Object.entries(fullRosterData).forEach(([team,rows])=>(rows||[]).forEach(r=>put(team,r[0],{pb10000:r[2],half:r[3]})));
      }
      if(typeof expandedTopAthletes2027!=='undefined'){
        Object.entries(expandedTopAthletes2027).forEach(([team,rows])=>(rows||[]).forEach(r=>put(team,r[0],{pb5000:r[2],pb10000:r[3],half:r[4]})));
      }
      if(typeof athleteData!=='undefined'){
        Object.entries(athleteData).forEach(([team,rows])=>(rows||[]).forEach(r=>put(team,r[0],{pb5000:r[1],pb10000:r[2],half:r[3]})));
      }
      exact.forEach((pb,key)=>{
        const nk=key.split('|')[0];
        if(!byName.has(nk))byName.set(nk,[]);
        byName.get(nk).push(pb);
      });
      return {exact,byName};
    }
    function lookup(name,team){
      const idx=pbIndex(),nk=nameNorm(name),tk=norm(teamNorm(team));
      const hit=idx.exact.get(nk+'|'+tk);
      if(hit)return hit;
      const list=idx.byName.get(nk)||[];
      return list.length===1?list[0]:{pb5000:'—',pb10000:'—',half:'—'};
    }
    function block(name,team){
      const pb=lookup(name,team);
      return '<div class="runtime-pb-block"><h4>自己ベスト</h4><div class="runtime-pb-grid">'+
        '<div><span>5000m PB</span><strong>'+pb.pb5000+'</strong></div>'+
        '<div><span>10000m PB</span><strong>'+pb.pb10000+'</strong></div>'+
        '<div><span>ハーフ PB</span><strong>'+pb.half+'</strong></div>'+
      '</div></div>';
    }
    function patchButton(btn){
      const row=btn.closest('tr'); if(!row)return;
      const name=btn.textContent.trim();
      const team=row.cells?.[1]?.textContent?.trim()||'';
      let detail=row.nextElementSibling;
      if(!detail||!detail.querySelector('td'))return;
      const cell=detail.querySelector('td');
      cell.querySelector('.runtime-pb-block')?.remove();
      cell.querySelector('.athlete-pb-block')?.remove();
      cell.insertAdjacentHTML('afterbegin',block(name,team));
    }
    document.addEventListener('click',e=>{
      const btn=e.target.closest('[data-all-athlete-player],[data-directory-player]');
      if(!btn)return;
      setTimeout(()=>patchButton(btn),0);
    });
    const obs=new MutationObserver(()=>{
      document.querySelectorAll('[data-all-athlete-player][aria-expanded="true"],[data-directory-player][aria-expanded="true"]').forEach(patchButton);
    });
    const app=document.getElementById('app'); if(app)obs.observe(app,{childList:true,subtree:true});
    window.__athletePbLookup=lookup;
  })();
  </script>
