name: Update University Meet Results

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/university-meet-sources.json"
      - "scripts/update-university-meets.mjs"
      - ".github/workflows/update-university-meets.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser
        run: npm install --no-save cheerio@1.0.0
      - name: Fetch and normalize official results
        run: node scripts/update-university-meets.mjs
      - name: Commit updated result DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hakone2027-site 3/university-meet-results-auto.js"
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update university meet results"
            git pull --rebase origin main
            git push
          fi
