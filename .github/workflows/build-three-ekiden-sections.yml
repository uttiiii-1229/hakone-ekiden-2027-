name: Build Three Ekiden Section DB

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-three-ekiden-sections.py'
      - '.github/workflows/build-three-ekiden-sections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4 pdfplumber
      - name: Build official section database
        run: python scripts/build-three-ekiden-sections.py
      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hakone2027-site 3/three-ekiden-sections-db.js"
          if git diff --cached --quiet; then
            echo "No DB changes"
            exit 0
          fi
          git commit -m "Generate Izumo and All-Japan section results DB"
          git pull --rebase origin main
          git push origin main
