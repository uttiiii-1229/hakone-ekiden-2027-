name: Build Hakone Qualifier DB
on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * 0"
  push:
    paths:
      - "scripts/build-hakone-qualifier-db.mjs"
      - ".github/workflows/build-hakone-qualifier-db.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save cheerio@1.0.0
      - run: node scripts/build-hakone-qualifier-db.mjs
      - name: Commit DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hakone2027-site 3/hakone-qualifier-db.js"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Hakone qualifier database"
          git pull --rebase origin main
          git push
