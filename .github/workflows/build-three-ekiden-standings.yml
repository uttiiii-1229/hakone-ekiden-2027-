name: Build Three Ekiden Standings DB

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-three-ekiden-standings.mjs'
      - '.github/workflows/build-three-ekiden-standings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standings database
        run: node scripts/build-three-ekiden-standings.mjs
      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hakone2027-site 3/three-ekiden-standings-db.js"
          if git diff --cached --quiet; then
            echo "No DB changes"
            exit 0
          fi
          git commit -m "Generate 2007-2026 three ekiden standings DB"
          git push
